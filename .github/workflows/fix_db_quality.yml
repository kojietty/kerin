name: 🧹 DBデータ品質修復

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true で件数確認のみ"
        required: false
        default: "false"

permissions:
  contents: write      # 修復した DB を commit & push

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-ci.txt

      - name: Fix DB quality
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="--dry-run"; fi
          python scripts/fix_db_quality.py $ARGS

      - name: Commit updated DB
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/keirin.db
          git diff --cached --quiet || git commit -m "chore: DBデータ品質修復 (style正規化・偽ラインクリア・bank_angle)"
          git push
